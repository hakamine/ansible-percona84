- name: "Install percona-release package"
  ansible.builtin.apt:
    deb: "https://repo.percona.com/apt/percona-release_latest.generic_all.deb"
  when: ansible_facts['os_family'] == "Debian"

# percona-release setup ps-84-lts --scheme https
- name: Enable Percona repository
  ansible.builtin.command: "percona-release setup ps-84-lts --scheme https"
  changed_when: false     # TODO: check for task idempotency

- name: "Install percona packages and dependencies (Debian)"
  ansible.builtin.apt:
    name:
      - "percona-server-server"
      - "percona-server-client"
    state: "present"
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"
