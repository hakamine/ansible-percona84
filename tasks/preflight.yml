- name: Ensure required packages are installed (Debian)
  ansible.builtin.apt:
    name:
      - gnupg2              # from Percona documentation
      - lsb-release         # from Percona documentation
      - python3-pymysql     # required for Ansible mysql modules
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"
